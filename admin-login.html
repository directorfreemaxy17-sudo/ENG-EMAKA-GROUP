    <form id="loginForm">

        <label for="email">

            required

        <label for="password">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://awkotcfeafnwfmmjmuwp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_puqds6nFS82t77iNOA0jwQ_WX-_kpDF";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    button.disabled = true;

    button.textContent =
        "INAINGIA...";

    message.style.display =
        "none";


    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            throw error;

        }


        if (!data.session) {

            throw new Error(
                "Login haikupata session."
            );

        }


        window.location.href =
            "admin.html";


    } catch (error) {

        message.textContent =
            "Login imekataa: " +
            error.message;

        message.className =
            "message error";

        message.style.display =
            "block";

    }


    button.disabled =
        false;

    button.textContent =
        "INGIA ADMIN";

});

</script>
