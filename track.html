<script>


const SUPABASE_URL =
    "https://awkotcfeafnwfmmjmuwp.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_puqds6nFS82t77iNOA0jwQ_WX-_kpDF";


const TABLE =
    "service_requests";


async function trackRequest() {


    const input =
        document.getElementById(
            "requestNumber"
        );


    const requestNumber =
        input.value.trim();


    const message =
        document.getElementById(
            "message"
        );


    const result =
        document.getElementById(
            "result"
        );


    result.style.display =
        "none";


    if (!requestNumber) {

        showMessage(
            "Tafadhali weka namba ya ombi.",
            true
        );

        return;
    }


    showMessage(
        "Inatafuta ombi...",
        false
    );


    try {


        const url =
            SUPABASE_URL +
            "/rest/v1/" +
            TABLE +
            "?request_number=eq." +
            encodeURIComponent(
                requestNumber
            ) +
            "&select=*";


        const response =
            await fetch(
                url,
                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                response.status +
                ": " +
                errorText
            );
        }


        const data =
            await response.json();


        if (
            !data ||
            data.length === 0
        ) {

            showMessage(
                "Namba ya ombi haijapatikana.",
                true
            );

            return;
        }


        const request =
            data[0];


        document.getElementById(
            "requestNumberResult"
        ).innerText =
            request.request_number || "";


        document.getElementById(
            "customerName"
        ).innerText =
            request.customer_name || "";


        document.getElementById(
            "customerPhone"
        ).innerText =
            request.customer_phone || "";


        document.getElementById(
            "location"
        ).innerText =
            request.location || "";


        document.getElementById(
            "service"
        ).innerText =
            request.service || "";


        document.getElementById(
            "description"
        ).innerText =
            request.description || "";


        document.getElementById(
            "createdAt"
        ).innerText =

            request.created_at
            ? new Date(
                request.created_at
              ).toLocaleString("sw-TZ")

            : "";


        const status =
            String(
                request.status || ""
            )
            .trim()
            .toUpperCase();


        const statusElement =
            document.getElementById(
                "status"
            );


        statusElement.innerText =
            status;


        statusElement.className =
            "status";


        if (
            status === "PENDING"
        ) {

            statusElement.classList.add(
                "pending"
            );

        }

        else if (
            status === "ACCEPTED"
        ) {

            statusElement.classList.add(
                "accepted"
            );

        }

        else if (
            status === "IN PROGRESS" ||
            status === "IN_PROGRESS"
        ) {

            statusElement.classList.add(
                "progress"
            );

        }

        else if (
            status === "COMPLETED"
        ) {

            statusElement.classList.add(
                "completed"
            );

        }

        else {

            statusElement.classList.add(
                "unknown"
            );

        }


        message.style.display =
            "none";


        result.style.display =
            "block";


    }

    catch (error) {

        console.error(error);

        showMessage(
            "Imeshindikana kutafuta ombi: " +
            error.message,
            true
        );

    }

}


function showMessage(
    text,
    isError
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.style.display =
        "block";


    if (isError) {

        message.style.background =
            "#fee2e2";

        message.style.color =
            "#991b1b";

    }

    else {

        message.style.background =
            "#dbeafe";

        message.style.color =
            "#1e40af";

    }

}


</script>


</body>
